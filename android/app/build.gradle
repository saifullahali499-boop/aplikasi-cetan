plugins {
    id "com.android.application"
    id "kotlin-android"
    // Plugin Google Services untuk Firebase
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.saifullah.cetan"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        // PERBAIKAN: Aktifkan Core Library Desugaring untuk mendukung API Java modern di Android lama (WebRTC/LiveKit butuh ini)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.saifullah.cetan"
        
        // Minimal SDK 23 (Sudah tepat untuk Firebase, LiveKit & WebRTC)
        minSdk 23
        
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // === PERBAIKAN UTAMA PENYEBAB CRASH ===
        // Mengaktifkan MultiDex agar aplikasi tidak crash saat memuat method dari WebRTC, LiveKit, dan Firebase sekaligus
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // PERBAIKAN: Dependency pendukung MultiDex & Desugaring
    implementation 'com.android.support:multidex:1.0.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}